<!doctype html>
<html lang="id">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KosPlanner</title>
  </head>

  <body>
    <div id="app"></div>
        <div id="app"></div>

    <aside id="panel">
      <h1>KosPlanner</h1>
      
      <h2>Ukuran ruangan</h2>
      <div class="row2">
        <label>Lebar (cm) <input id="room-w" type="number" min="150" max="600" step="5" value="300" /></label>
        <label>Panjang (cm) <input id="room-d" type="number" min="150" max="600" step="5" value="300" /></label>
      </div>
      <button id="btn-room" class="wide">Terapkan ukuran</button>

      <h2>Grid</h2>
      <label>Satuan grid
        <select id="sel-grid">
          <option value="10" selected>10 cm</option>
          <option value="25">25 cm</option>
          <option value="50">50 cm</option>
        </select>
      </label>
      <label class="check"><input id="chk-grid" type="checkbox" checked /> Tampilkan grid</label>
      <p class="hint">Furnitur menempel ke garis grid. Garis tebal = 1 m, sedang = 50 cm.</p>

      <h2>Kamera</h2>
      <div class="row">
        <button id="btn-view-left">&#9664; Putar</button>
        <button id="btn-view-right">Putar &#9654;</button>
      </div>
      <label class="check"><input id="chk-top" type="checkbox" /> Tampilan atas</label>

      <h2>Mode lantai</h2>
      <label class="check"><input id="chk-floor" type="checkbox" /> Tampilkan lantai terpakai / kosong</label>
      <label class="check"><input id="chk-hide" type="checkbox" disabled /> Sembunyikan furnitur (hanya warna)</label>
      <p class="hint"><span class="dot red"></span>terpakai <span class="dot green"></span>kosong <span class="dot blue"></span>area ayun pintu</p>
      
      <h2>Tambah furnitur</h2>
      <div id="catalog">
        <button data-type="bed">Kasur</button>
        <button data-type="desk">Meja belajar</button>
        <button data-type="wardrobe">Lemari</button>
        <button data-type="chair">Kursi</button>
      </div>

      <div id="edit" hidden>
        <h2 id="sel-name">Furnitur</h2>
        <label>Lebar (cm) <input id="in-w" type="number" min="30" max="300" step="5" /></label>
        <label>Dalam (cm) <input id="in-d" type="number" min="30" max="300" step="5" /></label>
        <label>Tinggi (cm) <input id="in-h" type="number" min="10" max="300" step="5" /></label>
        <div class="row">
          <button id="btn-rotate">Putar 90°</button>
          <button id="btn-delete" class="danger">Hapus</button>
        </div>
      </div>

      <h2>Jalur gerak</h2>

      <label>Lebar jalur minimum (cm)
        <input id="in-walk" type="number" min="40" max="80" step="5" value="60" />
      </label>

      <label class="check"><input id="chk-heat" type="checkbox" /> Tampilkan peta jalur</label>

      <div style="margin-top:8px">
        <span id="verdict" class="badge">-</span>
        <div id="score"></div>
        <ul id="notes"></ul>
      </div>

    </aside>

    <div id="toast"></div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/main.js"></script>
    
  </body>

</html>
